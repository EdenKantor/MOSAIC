name: Core CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: ${{ matrix.milestone }} / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        milestone: [milestone-0, milestone-1, milestone-1.25, milestone-2]
    defaults:
      run:
        working-directory: milestones/${{ matrix.milestone }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: false
      - name: Install locked core dependencies
        run: uv sync --locked --python 3.12
      - name: Check formatting
        run: uv run --no-sync python -m ruff format --check mosaic tests
      - name: Lint
        run: uv run --no-sync python -m ruff check mosaic tests
      - name: Check types
        run: uv run --no-sync python -m mypy mosaic tests
      - name: Test core
        run: uv run --no-sync python -m pytest -q -m "not alem"

  laboratory:
    name: Read-only Laboratory / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: milestones/laboratory
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: false
      - name: Install locked viewer checks
        run: uv sync --locked --python 3.12
      - name: Check formatting
        run: uv run --no-sync python -m ruff format --check laboratory tests
      - name: Lint
        run: uv run --no-sync python -m ruff check laboratory tests
      - name: Check types
        run: uv run --no-sync python -m mypy laboratory tests
      - name: Test read-only boundaries
        run: uv run --no-sync python -m unittest discover -s tests -v
